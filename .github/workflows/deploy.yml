name: Deploy Frontend

on:
  push:
    branches: [main, master]
  repository_dispatch:
    types: [cms-deploy]
  schedule:
    # Daily at 09:00 UTC (~1-2am Pacific) to pick up new Meetup events.
    - cron: '0 9 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  check-events:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Check if Meetup events changed
        id: diff
        run: |
          MEETUP_URL="https://www.meetup.com/north-county-urbanists/"
          HASH_KEY="meetup-events-hash.txt"
          BUCKET="${{ secrets.FRONTEND_S3_BUCKET }}"

          # Fetch current LD+JSON events from Meetup page
          CURRENT_HASH=$(curl -sf -A "Mozilla/5.0 (compatible; StosideBot/1.0)" "$MEETUP_URL" \
            | grep -oP '(?<=type="application/ld\+json">).*?(?=</script>)' \
            | sha256sum | cut -d' ' -f1)

          # Fetch previous hash from S3 (empty string if not found)
          PREVIOUS_HASH=$(aws s3 cp "s3://$BUCKET/$HASH_KEY" - 2>/dev/null || echo "")

          if [ "$CURRENT_HASH" = "$PREVIOUS_HASH" ]; then
            echo "Events unchanged — skipping build"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Events changed — triggering build"
            echo "$CURRENT_HASH" | aws s3 cp - "s3://$BUCKET/$HASH_KEY"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    # Run on non-schedule triggers unconditionally. On schedule, only if
    # check-events detected a change. The `always()` is needed because
    # when check-events is skipped (non-schedule), `needs` would otherwise
    # block this job from running.
    if: >-
      always() && (
        github.event_name != 'schedule' ||
        needs.check-events.outputs.changed == 'true'
      )
    needs: [check-events]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Strapi is reachable
        run: |
          for i in $(seq 1 6); do
            if curl -sf "$STRAPI_URL/api/articles" > /dev/null 2>&1; then
              echo "Strapi is reachable"
              exit 0
            fi
            echo "Attempt $i/6 — waiting 10s..."
            sleep 10
          done
          echo "::warning::Strapi unreachable at $STRAPI_URL — building without articles"
        env:
          STRAPI_URL: ${{ vars.STRAPI_URL }}

      - name: Build Gatsby site
        run: npm run build
        env:
          STRAPI_URL: ${{ vars.STRAPI_URL }}
          GATSBY_STRAPI_URL: ${{ vars.GATSBY_STRAPI_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy to S3 and invalidate CloudFront
        run: |
          aws s3 sync public/ s3://${{ secrets.FRONTEND_S3_BUCKET }} --delete \
            --cache-control "public, max-age=31536000, immutable"

          aws s3 cp public/ s3://${{ secrets.FRONTEND_S3_BUCKET }}/ \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --include "sw.js" \
            --include "*.webmanifest" \
            --include "page-data/*.json" \
            --include "page-data/**/*.json" \
            --metadata-directive REPLACE \
            --cache-control "public, max-age=0, must-revalidate"

          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*.html" "/page-data/*" "/sw.js" "/*.webmanifest"
